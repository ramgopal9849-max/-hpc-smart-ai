name: HPC Smart AI Code Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter and Dart Audit
        working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib
          flutter analyze
          if [ -d test ]; then flutter test; fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP Syntax Audit
        run: |
          find . -type d \( -name vendor -o -name .git \) -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: JSON Audit
        run: |
          find . -type d \( -name vendor -o -name .git \) -prune -o -type f -name '*.json' -print0 | while IFS= read -r -d '' f; do python3 -m json.tool "$f" >/dev/null || exit 1; done

      - name: YAML Audit
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/hpc-smart-ai-code-audit.yml", aliases: true)'

      - name: Audit Report
        if: always()
        run: |
          echo "## HPC Smart AI Code Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Check job logs for errors and affected file names." >> "$GITHUB_STEP_SUMMARY"
