name: HPC Smart AI Code Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Flutter, PHP, JSON and YAML Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter and Dart Audit
        working-directory: mobile
        run: |
          flutter --version
          flutter pub get
          dart format --output=none lib
          flutter analyze

          if [ -d test ]; then
            flutter test
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP Syntax Audit
        run: |
          find . -type d \( -name vendor -o -name .git \) -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: JSON Audit
        run: |
          find . -type d \( -name vendor -o -name .git \) -prune -o -type f -name '*.json' -print0 |
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null || exit 1
          done

      - name: YAML Audit
        run: |
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
          while IFS= read -r -d '' f; do
            ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' "$f" || exit 1
            echo "Valid YAML: $f"
          done

      - name: Audit Report
        if: always()
        run: |
          echo "## HPC Smart AI Code Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Flutter, PHP, JSON and YAML audit logs are available above." >> "$GITHUB_STEP_SUMMARY"
