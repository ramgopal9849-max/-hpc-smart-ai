
name: HPC Smart AI Application Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Build Versions
        run: |
          flutter --version
          java -version

      - name: Create Flutter Application
        run: |
          mkdir -p mobile
          cd mobile

          if [ ! -f pubspec.yaml ]; then
            flutter create \
              --org com.homeplumbercleaning \
              --project-name hpc_smart_ai \
              --platforms android,web .
          fi

          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Android Gradle Wrapper missing. Regenerating platform files."

            flutter create \
              --org com.homeplumbercleaning \
              --project-name hpc_smart_ai \
              --platforms android,web .
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle Wrapper was not generated."
            exit 1
          fi

          echo "Android Gradle Wrapper verified."
          ls -l android/gradlew

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure HPC Smart AI App Logo
        working-directory: mobile
        run: |
          if [ ! -f ../hpc-smart-ai-app-icon.png ]; then
            echo "ERROR: HPC Smart AI logo not found in repository root."
            exit 1
          fi

          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "../hpc-smart-ai-app-icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "../hpc-smart-ai-app-icon.png"
            web:
              generate: true
              image_path: "../hpc-smart-ai-app-icon.png"
              background_color: "#1769E0"
              theme_color: "#1769E0"
          YAML

          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Set Compatible Gradle Version
        run: |
          if [ ! -f mobile/android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper properties file is missing."
            exit 1
          fi

          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip#' mobile/android/gradle/wrapper/gradle-wrapper.properties

          echo "Selected Gradle version:"
          grep distributionUrl mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Download Gradle With Retry
        working-directory: mobile/android
        run: |
          chmod +x gradlew

          for i in 1 2 3 4 5; do
            echo "Gradle download attempt $i of 5"

            if ./gradlew --version --no-daemon; then
              echo "Gradle is ready."
              exit 0
            fi

            echo "Attempt failed. Waiting 30 seconds..."
            sleep 30
          done

          echo "Gradle could not be downloaded."
          exit 1

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Web Application
        working-directory: mobile
        run: flutter build web --release

      - name: Save Project Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-user@users.noreply.github.com"

          git add mobile/

          if ! git diff --cached --quiet; then
            git commit -m "Build HPC Smart AI Flutter application"
            git push
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HPC-Smart-AI-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web Application
        uses: actions/upload-artifact@v4
        with:
          name: HPC-Smart-AI-Web
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 14
