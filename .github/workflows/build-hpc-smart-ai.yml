name: HPC Smart AI Application Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-hpc-smart-ai.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and Web App
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Build Versions
        run: |
          flutter --version
          java -version

      - name: Prepare Missing Gradle Wrapper
        working-directory: mobile
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Creating a temporary Flutter project to obtain Gradle Wrapper files."

            flutter create \
              --org com.homeplumbercleaning \
              --project-name hpc_wrapper_seed \
              --platforms android \
              "$RUNNER_TEMP/hpc_wrapper_seed"

            cp "$RUNNER_TEMP/hpc_wrapper_seed/android/gradlew" android/
            cp "$RUNNER_TEMP/hpc_wrapper_seed/android/gradlew.bat" android/
            mkdir -p android/gradle/wrapper
            cp "$RUNNER_TEMP/hpc_wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/

            chmod +x android/gradlew
          fi

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          echo "Gradle Wrapper is ready."

      - name: Verify Gradle Version
        working-directory: mobile
        run: |
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          ./android/gradlew -p android --version

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Web Application
        working-directory: mobile
        run: flutter build web --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HPC-Smart-AI-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web Application
        uses: actions/upload-artifact@v4
        with:
          name: HPC-Smart-AI-Web
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 14
